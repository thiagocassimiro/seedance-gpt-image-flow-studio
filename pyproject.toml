[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seedance-gpt-image-flow-studio"
version = "0.1.0"
description = "Estúdio local de produção de vídeos com IA, com revisão e controle de custos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
